<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrientAttivo — Lezione Finale</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a09;--card:#1c1917;--card2:#292524;--border:#44403c;--fg:#fafaf9;--muted:#a8a29e;--accent:#f59e0b;--ok:#10b981;--err:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;--cyan:#06b6d4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-mesh .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.12;animation:blobMove 20s infinite alternate}
.blob-1{width:600px;height:600px;background:#f59e0b;top:-200px;left:-100px}
.blob-2{width:500px;height:500px;background:#ef4444;bottom:-150px;right:-100px;animation-delay:-7s}
.blob-3{width:400px;height:400px;background:#06b6d4;top:40%;left:50%;animation-delay:-14s}
@keyframes blobMove{0%{transform:translate(0,0) scale(1)}100%{transform:translate(80px,-60px) scale(1.15)}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:var(--accent);border-radius:50%;opacity:0;animation:particleFloat linear infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh)}10%{opacity:.6}90%{opacity:.6}100%{opacity:0;transform:translateY(-10vh)}}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
.screen{display:none;width:100%;max-width:1100px;animation:fadeSlideIn .5s ease}
.screen.active{display:block}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.glass{background:rgba(28,25,23,.75);backdrop-filter:blur(20px);border:1px solid rgba(68,64,60,.5);border-radius:1rem}
.progress-track{width:100%;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .6s}
.option-btn{width:100%;text-align:left;padding:1rem 1.25rem;border-radius:.75rem;border:2px solid var(--border);background:var(--card2);color:var(--fg);cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.75rem}
.option-btn:hover:not(.locked){border-color:var(--accent);background:rgba(245,158,11,.08);transform:translateX(4px)}
.option-btn .letter{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--card);border:2px solid var(--border)}
.option-btn.correct{border-color:var(--ok)!important;background:rgba(16,185,129,.1)!important}
.option-btn.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.option-btn.wrong{border-color:var(--err)!important;background:rgba(239,68,68,.1)!important}
.option-btn.wrong .letter{background:var(--err);border-color:var(--err);color:#fff}
.option-btn.locked{cursor:default;opacity:.7}
.explanation-box{padding:1rem;border-radius:.75rem;border-left:4px solid var(--accent);background:rgba(245,158,11,.06);margin-top:1rem}
.phase-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-radius:2rem;font-size:.75rem;font-weight:600;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:var(--accent)}
.timer-ring{position:relative;width:56px;height:56px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:3}
.timer-ring .track{stroke:var(--card2)}
.timer-ring .fill{stroke:var(--accent);stroke-linecap:round}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700}
.btn-primary{padding:.85rem 2rem;border-radius:.75rem;background:linear-gradient(135deg,var(--accent),#D97706);color:#0c0a09;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(245,158,11,.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{padding:.75rem 1.5rem;border-radius:.75rem;background:transparent;color:var(--fg);font-weight:600;border:2px solid var(--border);cursor:pointer}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
.phase-dots{display:flex;gap:.5rem;justify-content:center}
.phase-dot{width:40px;height:6px;border-radius:3px;background:var(--card2);transition:all .4s}
.phase-dot.active{width:60px;background:linear-gradient(90deg,var(--accent),var(--ok))}
.phase-dot.done{background:var(--ok)}
.celebration{position:fixed;inset:0;z-index:200;pointer-events:none}
.confetti{position:absolute;border-radius:2px;animation:confettiFall 3s forwards}
@keyframes confettiFall{to{opacity:0;transform:translateY(100vh) rotate(720deg)}}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);padding:.75rem 1.5rem;border-radius:.75rem;font-weight:600;z-index:300;animation:toastIn .4s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.id-step-bar{display:flex;gap:.25rem;margin-bottom:2rem;flex-wrap:wrap}
.id-step-pill{padding:.5rem .85rem;border-radius:2rem;font-size:.7rem;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--muted);cursor:pointer}
.id-step-pill.active{background:rgba(245,158,11,.15);border-color:var(--accent);color:var(--accent)}
.id-step-pill.done{background:rgba(16,185,129,.15);border-color:var(--ok);color:var(--ok)}
.id-field{margin-bottom:1.25rem}
.id-field-label{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:.5rem;display:flex;align-items:center;gap:.4rem}
.id-field-label i{color:var(--accent)}
.id-select{width:100%;padding:.75rem 1rem;border-radius:.75rem;border:2px solid var(--border);background:var(--card2);color:var(--fg);cursor:pointer}
.id-textarea{width:100%;padding:.75rem 1rem;border-radius:.75rem;border:2px solid var(--border);background:var(--card2);color:var(--fg);resize:vertical;min-height:60px}
.id-pills-grid{display:flex;flex-wrap:wrap;gap:.5rem}
.id-pill{padding:.45rem 1rem;border-radius:2rem;font-size:.78rem;font-weight:500;border:2px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer}
.id-pill.selected{background:rgba(245,158,11,.15);border-color:var(--accent);color:var(--accent)}
.id-likert{display:flex;gap:.4rem;flex-wrap:wrap}
.id-likert-btn{flex:1;min-width:50px;padding:.6rem .2rem;border-radius:.5rem;border:2px solid var(--border);background:var(--card2);color:var(--muted);font-weight:600;cursor:pointer;text-align:center}
.id-likert-btn.selected{background:rgba(245,158,11,.2);border-color:var(--accent);color:var(--accent)}
.id-likert-labels{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-top:.25rem}
.id-step-icon{font-size:2rem;margin-bottom:.75rem;display:block}
.id-step-title{font-family:'Space Grotesk';font-size:1.3rem;font-weight:700}
.id-step-desc{font-size:.85rem;color:var(--muted);margin-bottom:1.5rem}
.id-section-intro{background:rgba(245,158,11,.06);border:1px solid rgba(245,158,11,.2);border-radius:.75rem;padding:.75rem 1rem;margin-bottom:1.5rem;font-size:.82rem;color:#fbbf24}
.topic-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .85rem;border-radius:2rem;font-size:.7rem;font-weight:600;margin-bottom:1rem}
.rpt{background:#fff;color:#1a1a1a;padding:2rem;max-width:1000px;margin:0 auto}
.rpt h1{font-size:1.8rem;color:#0f766e;border-left:4px solid #10b981;padding-left:1rem;margin-bottom:1rem}
.rpt h2{font-size:1.2rem;color:#0f766e;margin:1.5rem 0 .75rem;border-bottom:2px solid #e2e8f0;padding-bottom:0.5rem;display:flex;align-items:center;gap:0.75rem}
.rpt h2 i{color:#f59e0b;font-size:1.3rem}
.rpt h3{font-size:1rem;color:#0f766e;margin:1rem 0 0.5rem 0;padding-left:0.5rem;border-left:3px solid}
.rpt p{font-size:.87rem;color:#475569;line-height:1.6}
.rpt-score-card{background:#f0fdf4;border:2px solid #10b981;border-radius:16px;padding:1.5rem;text-align:center;margin:1.5rem 0}
.rpt-score-num{font-size:2.5rem;font-weight:800;color:#0d9488}
.rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.rpt-grid-card{background:#f8fafc;border-radius:12px;padding:1rem;text-align:center;border-left:4px solid}
.rpt-grid-card .val{font-size:1.3rem;font-weight:700}
.rpt-bar{margin:.4rem 0}
.rpt-bar-track{height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.rpt-bar-fill{height:100%;border-radius:4px}
.rpt-tag{display:inline-block;padding:.2rem .6rem;border-radius:1rem;font-size:.72rem;font-weight:600;margin:.15rem;background:#f0fdf4;color:#065f46}
.rpt-progetto{background:#fefce8;border:1px solid #fde68a;border-radius:12px;padding:1.25rem}
.rpt-kiviat{background:#f8fafc;border-radius:16px;padding:1.5rem;margin:1.5rem 0;text-align:center}
.rpt-kiviat canvas,.rpt-kiviat img{max-width:500px;margin:0 auto;height:auto;display:block}
.rpt-classe{background:#f8fafc;border-radius:16px;padding:1.25rem}
.rpt-roadmap{background:linear-gradient(135deg,#f0fdf4,#eff6ff);border-radius:16px;padding:1.25rem;margin:1rem 0}
.rpt-roadmap-step{display:flex;gap:.75rem;align-items:flex-start;margin:.75rem 0}
.rpt-roadmap-num{width:28px;height:28px;border-radius:50%;background:#0f766e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;flex-shrink:0}
.kiviat-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:1rem;font-size:0.85rem}
.kiviat-legend span i{font-size:1rem}
.kiviat-legend span{font-size:0.85rem;color:#475569}
.quote-block{border-left:3px solid var(--accent);padding:12px 20px;background:rgba(245,158,11,.05);border-radius:0 12px 12px 0;margin:1rem 0;font-style:italic;font-size:.85rem}
.pill-group{display:flex;flex-wrap:wrap;gap:0.5rem;margin:1rem 0}
.pill{display:inline-block;padding:0.45rem 1rem;border-radius:2rem;font-size:0.78rem;font-weight:500;border:1px solid;background:rgba(77,150,255,0.1);border-color:rgba(77,150,255,0.3)}
@media(max-width:640px){.rpt-grid{grid-template-columns:1fr}.id-likert-btn{min-width:calc(33% - .35rem)}.kiviat-legend{font-size:0.7rem}}

.report-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    overflow-y: auto;
    padding: 1rem;
}
.report-modal-content {
    max-width: 1100px;
    margin: 0 auto;
    background: white;
    border-radius: 24px;
    overflow: hidden;
}
.report-modal-header {
    background: linear-gradient(135deg, #0f766e, #0d9488);
    padding: 0.75rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.report-modal-header h3 {
    color: white;
    font-size: 1.1rem;
    margin: 0;
}
.close-modal {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 1.3rem;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}
.close-modal:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.1);
}
.report-print-footer {
    text-align: center;
    padding: 1rem;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
}
.report-print-btn {
    background: linear-gradient(135deg, #f59e0b, #D97706);
    color: #0c0a09;
    padding: 0.5rem 1.5rem;
    border-radius: 0.75rem;
    font-weight: 700;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
}
.report-print-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(245,158,11,0.3);
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
}
.modal-container {
    background: var(--card);
    border-radius: 1.5rem;
    padding: 2rem;
    max-width: 400px;
    width: 90%;
    border: 1px solid var(--border);
}
</style>
</head>
<body>
<div class="bg-mesh"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
<div class="particles" id="particles"></div>
<div class="app">

<div class="screen active" id="welcomeScreen">
  <div class="glass p-8 text-center">
    <div class="inline-flex items-center gap-2 mb-6 px-4 py-2 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-400 text-sm font-semibold"><i class="fa-solid fa-compass"></i> Orientamento — Lezione Finale</div>
    <h1 class="text-3xl md:text-5xl font-bold mb-4">La Tua Prova Finale</h1>
    <p class="text-lg mb-2 text-muted">Quiz oggettivo + Profilo personalizzato + Questionario di Gradimento</p>
    <div class="mb-4"><div class="slider-label flex justify-between text-sm mb-2"><span><i class="fa-regular fa-face-frown"></i> Non pronto</span><span><i class="fa-regular fa-face-smile"></i> Prontissimo!</span></div>
    <input type="range" id="readinessSlider" min="0" max="10" value="5" step="1" class="w-full">
    <div class="text-center mt-2 text-sm text-amber-400" id="readinessValue">Livello 5/10</div></div>
    <div class="mb-6"><label class="block text-sm font-semibold mb-2 text-left text-muted">Il tuo nome e cognome</label>
    <input id="nameInput" type="text" placeholder="Scrivi il tuo nome e cognome..." class="w-full px-4 py-3 rounded-lg border-2 bg-transparent text-white focus:outline-none focus:border-amber-500" style="border-color:var(--border)"></div>
    <div class="flex gap-3">
      <button class="btn-primary flex-1 text-lg" id="startBtn" disabled>Inizia il Quiz</button>
      <button class="btn-secondary" id="skipToSecondPartBtn"><i class="fa-solid fa-key"></i> Seconda parte</button>
    </div>
  </div>
</div>

<div class="screen" id="quizScreen"><div id="quizContainer"></div></div>
<div class="screen" id="pauseScreen"><div id="pauseContent"></div></div>

<div class="screen" id="identikitScreen">
  <div class="glass p-6">
    <div class="text-center mb-4"><div class="inline-flex items-center gap-2 mb-3 px-4 py-2 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-400 text-sm font-semibold"><i class="fa-solid fa-dna"></i> Il tuo DNA</div>
    <h1 class="text-2xl md:text-3xl font-bold mb-1">Identità Personale e Professionale</h1>
    <p class="text-sm text-muted">Risposte soggettive — <span class="text-emerald-400">NON influenzano il punteggio</span></p></div>
    <div class="id-step-bar" id="idStepBar"></div>
    <div id="idStepContent"></div>
    <div class="flex gap-3 mt-6"><button class="btn-secondary" id="idPrevBtn" style="display:none"><i class="fa-solid fa-arrow-left mr-2"></i>Indietro</button><button class="btn-primary flex-1" id="idNextBtn">Avanti <i class="fa-solid fa-arrow-right ml-2"></i></button></div>
  </div>
</div>

<div class="screen" id="feedbackScreen"><div id="feedbackContent"></div></div>
<div class="screen" id="resultsScreen"><div id="resultsContent"></div></div>
</div>

<script>
// ==================== MODULI ====================
var MODULES = [
  {id:'m1', title:'Modulo 1 — Conoscere Se Stessi', icon:'fa-user', color:'#f59e0b'},
  {id:'m2', title:'Modulo 2 — Competenze e Team', icon:'fa-people-group', color:'#f97316'},
  {id:'m3', title:'Modulo 3 — Orientamento e Futuro', icon:'fa-map-location-dot', color:'#06b6d4'}
];

function Topic(icon, topic, color) { return { icon: icon, topic: topic, topicColor: color }; }

// ==================== DOMANDE OGGETTIVE ====================
function buildQuestions() {
  var Q = [], M1 = 0, M2 = 1, M3 = 2;
  
  // MODULO 1
  var t1 = Topic('fa-brain', '16Personalità & Johari', '#c77dff');
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Quanti gruppi principali individua il test 16Personalità?', opts: ['2', '3', '4', '6'], correct: 2, explain: '4 gruppi: Analisti, Diplomatici, Sentinel, Esploratori.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'truefalse', q: 'La personalità è fissa dalla nascita e non può cambiare.', correct: false, explain: 'Falso. Può evolversi con le esperienze.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'Nella Finestra di Johari, l\'area con info note a sé e agli altri è "Area ______".', opts: ['Aperta', 'Cieca', 'Nascosta', 'Sconosciuta'], correct: 0, explain: 'Area Aperta.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'Nella Finestra di Johari, l\'area che contiene informazioni note agli altri ma non a sé stessi è il "Punto ______".', opts: ['Aperto', 'Cieco', 'Nascosto', 'Sconosciuto'], correct: 1, explain: 'Punto Cieco: gli altri vedono, tu no.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'truefalse', q: 'La Finestra di Johari è composta da 4 quadranti.', correct: true, explain: 'Vero: Arena, Punto Cieco, Area Nascosta, Area Sconosciuta.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'truefalse', q: 'L\'obiettivo della Finestra di Johari è ampliare l\'Arena e ridurre il Punto Cieco.', correct: true, explain: 'Vero: ricevendo feedback si riduce il punto cieco.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'I quattro gruppi principali del test 16Personalità sono: Analisti, ______, Sentinel ed Esploratori.', opts: ['Diplomatici', 'Strategici', 'Empatici', 'Organizzatori'], correct: 0, explain: 'Diplomatici è il secondo gruppo.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'Il gruppo degli ______ è caratterizzato da logica, strategia e pensiero critico.', opts: ['Analisti', 'Diplomatici', 'Sentinel', 'Esploratori'], correct: 0, explain: 'Gli Analisti sono logici e strategici.' }, t1));
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Quale di questi è un gruppo del test 16Personalità?', opts: ['Analisti', 'Matematici', 'Artisti', 'Scienziati'], correct: 0, explain: 'I 4 gruppi sono: Analisti, Diplomatici, Sentinel, Esploratori.' }, t1));
  
  var t2 = Topic('fa-chart-simple', 'SWOT & Responsabilità', '#f59e0b');
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Nella SWOT, la S (Strengths) rappresenta:', opts: ['Strategia', 'Sviluppo', 'Punti di Forza', 'Situazione'], correct: 2, explain: 'Strengths = Punti di Forza.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Nella SWOT, la W (Weaknesses) rappresenta:', opts: ['Punti di Debolezza', 'Work', 'Watch', 'Win'], correct: 0, explain: 'Weaknesses = Debolezze.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Nella SWOT, la O (Opportunities) rappresenta:', opts: ['Obiettivi', 'Opportunità', 'Osservazione', 'Organizzazione'], correct: 1, explain: 'Opportunità.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'single', q: 'Nella SWOT, la T (Threats) rappresenta:', opts: ['Tempo', 'Tattica', 'Minacce', 'Team'], correct: 2, explain: 'Threats = Minacce.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'Nella SWOT personale, i Punti di Forza (Strengths) e le Debolezze (Weaknesses) sono fattori ______ (interni/esterni).', opts: ['interni', 'esterni', 'misti', 'variabili'], correct: 0, explain: 'Sono fattori interni alla persona.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'completion', q: 'Nella SWOT personale, le Opportunità (Opportunities) e le Minacce (Threats) sono fattori ______ (interni/esterni).', opts: ['interni', 'esterni', 'misti', 'variabili'], correct: 1, explain: 'Sono fattori esterni al contesto.' }, t2));
  Q.push(Object.assign({ module: M1, type: 'truefalse', q: 'La SWOT analysis trasforma l\'autoconsapevolezza in un piano d\'azione.', correct: true, explain: 'Vero: la SWOT collega consapevolezza e azione.' }, t2));

function startTimer(reset) {
  if (appState.timerInterval) clearInterval(appState.timerInterval);

  var circumference = 2 * Math.PI * 24;
  appState.timerInterval = setInterval(function() {

    appState.timerSeconds--;

    var tt = document.getElementById('timerText'); if (tt) tt.textContent = mins;

function toggleMultiple(gI, optIndex, btnElement) {
  var q = getCurrentQ();
  if (!q) return;
  if (appState.answers[gI] !== undefined) return;
  
  var selected = appState.multipleSel[gI] || [];
  var pos = selected.indexOf(optIndex);
  if (pos === -1) {
    selected.push(optIndex);
    if (btnElement) btnElement.classList.add('border-emerald-500', 'bg-emerald-500/10');
  } else {
    selected.splice(pos, 1);
    if (btnElement) btnElement.classList.remove('border-emerald-500', 'bg-emerald-500/10');
  }
  appState.multipleSel[gI] = selected;
  renderQuiz();
}

function confirmMultiple() {
  var q = getCurrentQ();
  if (!q) return;
  var gI = getCurrentIndex();
  if (appState.answers[gI] !== undefined) return;
  
  var selected = appState.multipleSel[gI] || [];
  var correctArr = q.correct;
  
  var ok = (selected.length === correctArr.length && 
            correctArr.every(function(c) { return selected.indexOf(c) !== -1; }));
  
  appState.answers[gI] = { selected: selected, correct: ok };
  if (ok) appState.score += 10;
  renderQuiz();
}

function selAns(v) { var q = getCurrentQ(); if (!q) return; if (appState.answers[getCurrentIndex()] !== undefined) return; var gI = getCurrentIndex(); var ok = (v === q.correct); appState.answers[gI] = { selected: v, correct: ok }; if (ok) appState.score += 10; renderQuiz(); }
function rankMove(g, p, d) { if (appState.answers[g]) return; var q = getCurrentQ(); if (!q) return; var s = (appState.rankS[g] || q.items.map(function(_, i) { return i; })).slice(); if (d === 'up' && p > 0) { var tmp = s[p - 1]; s[p - 1] = s[p]; s[p] = tmp; } if (d === 'down' && p < s.length - 1) { var tmp2 = s[p]; s[p] = s[p + 1]; s[p + 1] = tmp2; } appState.rankS[g] = s; renderQuiz(); }
function subRank(g) { if (appState.answers[g]) return; var q = getCurrentQ(); if (!q) return; var s = appState.rankS[g]; var ok = true; if (!s) ok = false; else for (var i = 0; i < q.correct.length; i++) if (s[i] !== q.correct[i]) { ok = false; break; } appState.answers[g] = { selected: s, correct: ok }; if (ok) appState.score += 10; renderQuiz(); }
function selSeq(g, i) { if (appState.answers[g]) return; var sv = (appState.seqS[g] || []).slice(); if (sv.indexOf(i) === -1) { sv.push(i); appState.seqS[g] = sv; renderQuiz(); } }
function subSeq(g) { if (appState.answers[g]) return; var q = getCurrentQ(); if (!q) return; var sv = appState.seqS[g]; var ok = true; if (!sv || sv.length !== q.correct.length) ok = false; else for (var i = 0; i < q.correct.length; i++) if (sv[i] !== q.correct[i]) { ok = false; break; } appState.answers[g] = { selected: sv, correct: ok }; if (ok) appState.score += 10; renderQuiz(); }
function nextQ() { var mq = OBJECTIVE_QS.filter(function(q) { return q.module === appState.module; }); if (appState.qIndex < mq.length - 1) { appState.qIndex++; } else if (appState.module < MODULES.length - 1) { appState.module++; appState.qIndex = 0; spawnConfetti(120); showToast('🎉 ' + MODULES[appState.module].title + ' completato!', '#10b981'); } else { stopTimer(); showPause(); return; } renderQuiz(); }

function togglePill(arr, val) { var idx = idData[arr].indexOf(val); if (idx === -1) idData[arr].push(val); else idData[arr].splice(idx, 1); renderIdFields(idStep); }
function idNav(dir) { if (dir === 1 && idStep === 7) { showThankYouScreen(); return; } idStep = Math.max(0, Math.min(7, idStep + dir)); renderIdStep(); }

function openReportModal(htmlContent, title) {
  var existingModal = document.querySelector('.report-modal');
  if (existingModal) existingModal.remove();
  
  var modal = document.createElement('div');
  modal.className = 'report-modal';
  modal.innerHTML = `
    <div class="report-modal-content">
      <div class="report-modal-header">

      </div>
      <div id="reportContent" style="padding: 1.5rem; max-height: 70vh; overflow-y: auto; background: white;">
        ${htmlContent}
      </div>
      <div class="report-print-footer">
        <button class="report-print-btn" onclick="printReportFromModalWithCanvas()">
          <i class="fa-solid fa-print"></i> Stampa / Salva PDF
        </button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  
  window.printReportFromModalWithCanvas = function() {
    var canvas = document.getElementById('kiviatCanvasReport');
    if (canvas && canvas._chart) {

        try {

          printContent = printContent.replace(/height="[^"]*"/g, '');
          printContent = printContent.replace('</canvas>', '');
          
          var printWindow = window.open('', '_blank');
          printWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>${title}</title>
              <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

                .rpt h3{font-size:1rem;color:#0f766e;margin:1rem 0 0.5rem 0;padding-left:0.5rem;border-left:3px solid}
                .rpt p{font-size:.87rem;color:#475569;line-height:1.6}
                .rpt-score-card{background:#f0fdf4;border:2px solid #10b981;border-radius:16px;padding:1.5rem;text-align:center;margin:1.5rem 0}
                .rpt-score-num{font-size:2.5rem;font-weight:800;color:#0d9488}
                .rpt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}

// ==================== KIVIAT ====================
function calculateKiviatScores() {
  var scores = { autoconsapevolezza: 0, competenze: 0, ambiente: 0, conoscenza: 0, gestioneOstacoli: 0, progettualita: 0 };
  var selfScore = 0; if (idData.personalita) selfScore++; if (idData.coping) selfScore++; if (idData.responsabilita) selfScore++; if (idData.emozionePeggiore) selfScore++; if (idData.emozioneMeglio) selfScore++; scores.autoconsapevolezza = Math.round((selfScore / 5) * 10);
  var compScore = 0; if (idData.hardSkills.length || idData.altreHard) compScore++; if (idData.softSkills.length || idData.altreSoft) compScore++; if (idData.talenti.length > 0) compScore++; scores.competenze = Math.round((compScore / 3) * 10);
  var ambScore = 0; if (idData.settore) ambScore++; if (idData.dimensione) ambScore++; if (idData.condizione) ambScore++; scores.ambiente = Math.round((ambScore / 3) * 10);
  var conoscScore = 0; if (idData.dopoDiploma && idData.dopoDiploma !== 'Altro') conoscScore++; if (idData.esperienze.length || idData.esperienzeAltro) conoscScore++; if (idData.mobilita && idData.mobilita !== 'Resto in città') conoscScore++; scores.conoscenza = Math.round((conoscScore / 3) * 10);
  var ostVals = Object.values(idData.ostacoli); var ostAvg = ostVals.reduce(function(a, b) { return a + b; }, 0) / ostVals.length; scores.gestioneOstacoli = Math.round((1 - (ostAvg - 1) / 4) * 10); if (scores.gestioneOstacoli < 0) scores.gestioneOstacoli = 0; if (scores.gestioneOstacoli > 10) scores.gestioneOstacoli = 10;
  var projScore = 0; if (idData.progetto.breve) projScore++; if (idData.progetto.medio) projScore++; if (idData.progetto.lungo) projScore++; scores.progettualita = Math.round((projScore / 3) * 10);
  return scores;
}

  var suggerimenti = [];
  if (CLASSE.studiaMeno1Ora > 60 && CLASSE.prioritaLavoro.guadagno > 70) {
    suggerimenti.push({ icona: '⏰', titolo: 'Il gap che può cambiare il tuo futuro', testo: 'Nella tua classe, il 63% studia meno di 1 ora al giorno ma il 71% vuole guadagnare bene. Aggiungi solo 30 minuti al giorno di studio attivo: in un mese sono +10 ore di apprendimento.' });
  }
  if (CLASSE.reazioneDifficolta.evita + CLASSE.reazioneDifficolta.rimanda > 70) {
    suggerimenti.push({ icona: '🧗', titolo: 'La difficoltà non è un muro, è un gradino', testo: 'Il 76% della classe evita o rimanda gli argomenti difficili. Prova la regola dei 5 minuti: inizia l\'argomento difficile e poi decidi se continuare.' });
  }
  if (CLASSE.apertoAMobilita > 75) {
    suggerimenti.push({ icona: '🌍', titolo: 'La tua classe è pronta a spostarsi!', testo: 'L\'80% della classe è aperto a trasferirsi per lavoro. Informati su Erasmus+, ErasmusPro e tirocini all\'estero.' });
  }
  if (idData.hardSkills.length === 0 && idData.softSkills.length === 0) {
    suggerimenti.push({ icona: '🛠️', titolo: 'Le tue competenze sono un tesoro da scoprire', testo: 'Prova a fare un elenco di 5 cose che sai fare bene (anche fuori dalla scuola) e 5 modi in cui aiuti gli altri. Quello è l\'inizio del tuo CV.' });
  } else if (idData.hardSkills.length > 0 && idData.softSkills.length > 0) {
    suggerimenti.push({ icona: '🎯', titolo: 'Hai già mappato le tue competenze!', testo: 'Le tue Hard Skill (' + idData.hardSkills.slice(0,3).join(', ') + (idData.hardSkills.length > 3 ? '...' : '') + ') e Soft Skill sono il tuo punto di partenza.' });
  }
  if (!idData.progetto.breve && !idData.progetto.medio && !idData.progetto.lungo) {
    suggerimenti.push({ icona: '🗺️', titolo: 'Il futuro si progetta un passo alla volta', testo: 'Prova a immaginarti tra 5 anni: dove sei? cosa fai? chi sei? Da lì, torna indietro e scrivi i passi intermedi.' });
  }
  return suggerimenti;
}
